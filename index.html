<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סידור הילולת רבי שלמה</title>
<meta name="description" content="תהלים ותפילת מנחה להילולת רבי שלמה קרליבך, עם שירי רבי שלמה – עובד גם בלי אינטרנט">
<meta name="theme-color" content="#551b53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סידור שלמה">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/FrankRuehlCLM-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar" id="bar">
  <button class="icon-btn" id="btn-menu" aria-label="תוכן העניינים" data-i18n-aria="contents" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <button class="icon-btn" id="btn-home" aria-label="מסך הבית" data-i18n-aria="home" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
  </button>
  <div class="bar-title">
    <div class="bar-book" id="bar-book">סידור הילולת רבי שלמה</div>
    <div class="bar-sec" id="bar-sec"></div>
  </div>
  <button class="icon-btn lang-btn" id="btn-lang" aria-label="Switch to English" data-i18n-aria="langAria" data-i18n="langBtn">EN</button>
  <button class="icon-btn" id="btn-theme" aria-label="מעבר למצב כהה">
    <svg class="ic-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <button class="icon-btn" id="btn-settings" aria-label="הגדרות תצוגה" data-i18n-aria="settings">
    <span class="aa" data-i18n="aa">א<small>א</small></span>
  </button>
</header>

<main id="main"></main>

<!-- table of contents drawer -->
<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="תוכן העניינים" data-i18n-aria="contents" hidden>
  <div class="drawer-head">
    <span id="drawer-title" data-i18n="contents">תוכן העניינים</span>
    <button class="icon-btn" id="drawer-close" aria-label="סגירה" data-i18n-aria="close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</nav>

<!-- settings sheet -->
<section class="sheet" id="settings" hidden aria-label="הגדרות" data-i18n-aria="settingsShort">
  <div class="sheet-grip"></div>
  <h3 data-i18n="settings">הגדרות תצוגה</h3>
  <label class="row">
    <span data-i18n="fontSize">גודל אותיות</span>
    <span class="size-ctl">
      <button class="pill" id="fs-down" aria-label="הקטנה" data-i18n-aria="smaller" data-i18n="fsDown">א־</button>
      <input type="range" id="fs" min="16" max="40" step="1">
      <button class="pill" id="fs-up" aria-label="הגדלה" data-i18n-aria="larger" data-i18n="fsUp">א+</button>
    </span>
  </label>
  <div class="preview" id="fs-preview" dir="rtl" lang="he">אַשְׁרֵי יוֹשְׁבֵי בֵיתֶךָ</div>
  <div class="row">
    <span data-i18n="theme">מצב תצוגה</span>
    <span class="seg" id="theme-seg">
      <button data-theme="light" data-i18n="light">בהיר</button>
      <button data-theme="auto" data-i18n="auto">אוטומטי</button>
      <button data-theme="dark" data-i18n="dark">כהה</button>
    </span>
  </div>
  <label class="row" id="wake-row">
    <span data-i18n="wake">השאר את המסך דולק</span>
    <input type="checkbox" id="wake" class="switch">
  </label>
  <button class="close-wide" data-close data-i18n="close">סגירה</button>
</section>

<!-- song sheet -->
<section class="sheet" id="songsheet" hidden aria-label="שיר" data-i18n-aria="song"></section>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
